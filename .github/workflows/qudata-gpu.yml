name: Qudata GPU backend image
on:
  push:
    branches: [feat/qudata-gpu-template]
    paths: [deploy/qudata/**, infra/**, tools/**, packs/**, apps/**, package.json, package-lock.json, .github/workflows/qudata-gpu.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: qudata-gpu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LOCAL_IMAGE: freefield-qudata-ci:local
      COMFY_BASE_URL: http://127.0.0.1:18000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Startup policy tests
        run: |
          bash -n deploy/qudata/start.sh
          python3 -m unittest discover -s deploy/qudata -p test_serve.py -v
          npm ci --ignore-scripts --no-audit --no-fund
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build without models or credentials
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/qudata/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: FREEFIELD_REVISION=${{ github.sha }}
      - name: Create ephemeral test token
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "FREEFIELD_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Test original ENTRYPOINT on CPU without model weights
        run: |
          docker run -d --name freefield-ci-entrypoint -p 127.0.0.1:18000:8000 -e FREEFIELD_TOKEN -e FREEFIELD_DEVICE=cpu "$LOCAL_IMAGE"
          python3 deploy/qudata/check_backend.py
          docker exec -i freefield-ci-entrypoint /opt/conda/bin/python - < deploy/qudata/check_nodes.py
          npm run app -- smoke --set width=128 --set height=128
          docker stop --time 30 freefield-ci-entrypoint
      - name: Test platform-style ENTRYPOINT override and repeated initialization
        run: |
          docker run -d --name freefield-ci-qudata -p 127.0.0.1:18000:8000 -e FREEFIELD_TOKEN -e FREEFIELD_DEVICE=cpu --entrypoint /bin/bash "$LOCAL_IMAGE" -c 'bash /opt/freefield-qudata/start.sh start; bash /opt/freefield-qudata/start.sh start; exec sleep infinity'
          python3 deploy/qudata/check_backend.py
          npm run app -- smoke --set width=128 --set height=128
          docker exec freefield-ci-qudata bash -c 'test "$(pgrep -fc "^/opt/conda/bin/python /opt/freefield-qudata/serve.py$")" = 1'
          docker stop --time 30 freefield-ci-qudata
      - name: Failure diagnostics (no environment dump)
        if: failure()
        run: |
          docker logs --tail 150 freefield-ci-entrypoint || true
          docker logs --tail 100 freefield-ci-qudata || true
          docker exec freefield-ci-qudata tail -150 /data/freefield/logs/backend.log || true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only after model-free integration tests pass
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/freefield-gpu"
          version="qudata-${GITHUB_SHA:0:12}-cu128"
          docker tag "$LOCAL_IMAGE" "$repository:$version"
          docker push "$repository:$version"
          printf 'Image: `%s:%s`\n\nCPU integration passed. Real NVIDIA/Qudata generation has NOT been tested. Model weights are NOT included.\n' "$repository" "$version" >> "$GITHUB_STEP_SUMMARY"
